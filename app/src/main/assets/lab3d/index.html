<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VirtuLab 3D Interactive Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090D16;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            pointer-events: none;
            color: #00E5FF;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0,229,255,0.4);
            background: rgba(17, 24, 39, 0.7);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        #status-indicator {
            position: absolute;
            bottom: 12px;
            right: 12px;
            pointer-events: none;
            color: #94A3B8;
            font-size: 10px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s ease-out;
        }
    </style>
    <!-- Lightweight Three.js CDN with offline fallback WebGL engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud-overlay">VIRTU-LAB 3D // REAL-TIME RENDERER</div>
    <div id="status-indicator">Drag to orbit • Pinch to zoom</div>
    <div id="flash-overlay" class="flash-overlay"></div>
    <canvas id="webgl-canvas"></canvas>

    <script>
        // Lab State
        let scene, camera, renderer;
        let labTable, beakerGroup, liquidMesh, bunsenFlame, burnerGroup;
        let particles = [];
        let bubbleParticles = [];
        let smokeParticles = [];
        let liquidLevel = 0.2;
        let targetLiquidColor = new THREE.Color(0x1e3a5f);
        let currentLiquidColor = new THREE.Color(0x1e3a5f);
        let isBurnerOn = false;
        let isReacting = false;
        let isOrbiting = false;
        let prevMouseX = 0, prevMouseY = 0;
        let targetRotationY = 0.2, targetRotationX = 0.2;
        let currentRotationY = 0.2, currentRotationX = 0.2;

        function initScene() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x090D16, 0.04);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2.5, 5.5);
            camera.lookAt(0, 0.8, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Ambient & Directional Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);

            const spotLight = new THREE.SpotLight(0x00E5FF, 1.8);
            spotLight.position.set(3, 6, 4);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            scene.add(spotLight);

            const warmRimLight = new THREE.PointLight(0xFF9100, 1.0, 10);
            warmRimLight.position.set(-3, 2, -2);
            scene.add(warmRimLight);

            buildLaboratoryEnvironment();
            setupEventListeners();
            animate();
        }

        function buildLaboratoryEnvironment() {
            // Lab Bench Table Top
            const tableGeo = new THREE.BoxGeometry(6, 0.15, 3.5);
            const tableMat = new THREE.MeshStandardMaterial({
                color: 0x111827,
                roughness: 0.3,
                metalness: 0.2
            });
            labTable = new THREE.Mesh(tableGeo, tableMat);
            labTable.position.set(0, -0.075, 0);
            labTable.receiveShadow = true;
            scene.add(labTable);

            // Table Grid Neon Trim
            const gridHelper = new THREE.GridHelper(6, 12, 0x00E5FF, 0x1E293B);
            gridHelper.position.set(0, 0.001, 0);
            scene.add(gridHelper);

            // Lab Beaker Construction
            beakerGroup = new THREE.Group();
            beakerGroup.position.set(0, 0, 0);

            // Beaker Glass Outer Wall
            const glassGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.8, 32, 1, true);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.32,
                roughness: 0.1,
                transmission: 0.85,
                thickness: 0.1,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });
            const glassBeaker = new THREE.Mesh(glassGeo, glassMat);
            glassBeaker.position.y = 0.9;
            glassBeaker.castShadow = true;
            beakerGroup.add(glassBeaker);

            // Beaker Base Bottom
            const baseGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.05, 32);
            const baseMesh = new THREE.Mesh(baseGeo, glassMat);
            baseMesh.position.y = 0.025;
            beakerGroup.add(baseMesh);

            // Beaker Volumetric Graduation Rings
            const ringMat = new THREE.LineBasicMaterial({ color: 0x94A3B8, transparent: true, opacity: 0.6 });
            for (let i = 1; i <= 4; i++) {
                const ringGeo = new THREE.BufferGeometry();
                const points = [];
                const radius = 0.705;
                for (let a = -0.8; a <= 0.8; a += 0.1) {
                    points.push(new THREE.Vector3(Math.cos(a) * radius, i * 0.35, Math.sin(a) * radius));
                }
                ringGeo.setFromPoints(points);
                const ring = new THREE.Line(ringGeo, ringMat);
                beakerGroup.add(ring);
            }

            // Liquid Fluid Inside Beaker
            const liquidGeo = new THREE.CylinderGeometry(0.67, 0.67, 0.8, 32);
            const liquidMat = new THREE.MeshStandardMaterial({
                color: currentLiquidColor,
                transparent: true,
                opacity: 0.75,
                roughness: 0.15,
                metalness: 0.1
            });
            liquidMesh = new THREE.Mesh(liquidGeo, liquidMat);
            liquidMesh.position.y = 0.4;
            liquidMesh.scale.set(1, 0.5, 1);
            beakerGroup.add(liquidMesh);

            // Bunsen Burner Apparatus (Left Side)
            burnerGroup = new THREE.Group();
            burnerGroup.position.set(-1.8, 0, 0);

            const burnerBaseGeo = new THREE.CylinderGeometry(0.5, 0.55, 0.1, 24);
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8, roughness: 0.3 });
            const burnerBase = new THREE.Mesh(burnerBaseGeo, metalMat);
            burnerBase.position.y = 0.05;
            burnerGroup.add(burnerBase);

            const burnerStemGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 16);
            const burnerStem = new THREE.Mesh(burnerStemGeo, metalMat);
            burnerStem.position.y = 0.45;
            burnerGroup.add(burnerStem);

            // Burner Flame (Cone)
            const flameGeo = new THREE.ConeGeometry(0.12, 0.45, 16);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0x00E5FF, transparent: true, opacity: 0.0 });
            bunsenFlame = new THREE.Mesh(flameGeo, flameMat);
            bunsenFlame.position.y = 1.05;
            burnerGroup.add(bunsenFlame);

            scene.add(burnerGroup);
            scene.add(beakerGroup);
        }

        // Particle Trigger for Sodium + Water Explosion
        function triggerSodiumWaterExplosion() {
            isReacting = true;
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            // Dynamic color shift to basic alkaline (purple-pink with phenolphthalein or turquoise caustic NaOH)
            targetLiquidColor = new THREE.Color(0xFF4081);

            // Spawn Spark Particles
            for (let i = 0; i < 180; i++) {
                const geo = new THREE.SphereGeometry(0.02 + Math.random() * 0.02, 6, 6);
                const mat = new THREE.MeshBasicMaterial({
                    color: Math.random() > 0.3 ? 0xFFFF00 : 0xFF5722,
                    transparent: true,
                    opacity: 1
                });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(
                    (Math.random() - 0.5) * 0.4,
                    0.6 + Math.random() * 0.2,
                    (Math.random() - 0.5) * 0.4
                );
                p.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.12,
                    0.08 + Math.random() * 0.12,
                    (Math.random() - 0.5) * 0.12
                );
                p.life = 1.0;
                scene.add(p);
                particles.push(p);
            }

            // Spawn Smoke Cloud Particles
            for (let i = 0; i < 40; i++) {
                const sGeo = new THREE.SphereGeometry(0.08 + Math.random() * 0.08, 8, 8);
                const sMat = new THREE.MeshStandardMaterial({
                    color: 0xE2E8F0,
                    transparent: true,
                    opacity: 0.6,
                    roughness: 0.9
                });
                const smoke = new THREE.Mesh(sGeo, sMat);
                smoke.position.set(
                    (Math.random() - 0.5) * 0.3,
                    0.8 + Math.random() * 0.2,
                    (Math.random() - 0.5) * 0.3
                );
                smoke.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.03,
                    0.02 + Math.random() * 0.04,
                    (Math.random() - 0.5) * 0.03
                );
                smoke.life = 1.0;
                scene.add(smoke);
                smokeParticles.push(smoke);
            }

            cameraShake(0.2, 350);

            if (window.AndroidLab && window.AndroidLab.onReactionTriggered) {
                window.AndroidLab.onReactionTriggered("SODIUM_WATER");
            }
        }

        // Particle Trigger for Sodium + Chlorine Incandescent Synthesis (Table Salt)
        function triggerSodiumChlorineSynthesis() {
            isReacting = true;
            const flash = document.getElementById('flash-overlay');
            flash.style.background = 'rgba(255, 255, 200, 0.95)';
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0.3'; }, 100);
            setTimeout(() => { flash.style.opacity = '0'; flash.style.background = 'rgba(255, 255, 255, 0.85)'; }, 350);

            // Container shifts to white crystalline salt residue
            targetLiquidColor = new THREE.Color(0xF8FAFC);

            // 240+ Blinding Golden-White Incandescent Sparks
            for (let i = 0; i < 240; i++) {
                const geo = new THREE.SphereGeometry(0.025 + Math.random() * 0.03, 6, 6);
                const isWhite = Math.random() > 0.4;
                const mat = new THREE.MeshBasicMaterial({
                    color: isWhite ? 0xFFFFFF : 0xFFD700,
                    transparent: true,
                    opacity: 1
                });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(
                    (Math.random() - 0.5) * 0.35,
                    0.5 + Math.random() * 0.3,
                    (Math.random() - 0.5) * 0.35
                );
                p.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.16,
                    0.12 + Math.random() * 0.18,
                    (Math.random() - 0.5) * 0.16
                );
                p.life = 1.3;
                scene.add(p);
                particles.push(p);
            }

            // 70+ Dense White NaCl Salt Smoke Plumes
            for (let i = 0; i < 70; i++) {
                const sGeo = new THREE.SphereGeometry(0.09 + Math.random() * 0.1, 8, 8);
                const sMat = new THREE.MeshStandardMaterial({
                    color: 0xFFFFFF,
                    transparent: true,
                    opacity: 0.75,
                    roughness: 0.9
                });
                const smoke = new THREE.Mesh(sGeo, sMat);
                smoke.position.set(
                    (Math.random() - 0.5) * 0.4,
                    0.7 + Math.random() * 0.4,
                    (Math.random() - 0.5) * 0.4
                );
                smoke.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.04,
                    0.03 + Math.random() * 0.05,
                    (Math.random() - 0.5) * 0.04
                );
                smoke.life = 1.4;
                scene.add(smoke);
                smokeParticles.push(smoke);
            }

            cameraShake(0.35, 500);

            if (window.AndroidLab && window.AndroidLab.onReactionTriggered) {
                window.AndroidLab.onReactionTriggered("SODIUM_CHLORINE");
            }
        }

        // Generic Chemical Trigger
        window.triggerReaction = function(reactionType, details) {
            if (reactionType === "SODIUM_CHLORINE") {
                triggerSodiumChlorineSynthesis();
            } else if (reactionType === "SODIUM_WATER") {
                triggerSodiumWaterExplosion();
            } else if (reactionType === "MAGNESIUM_OXYGEN") {
                triggerSodiumChlorineSynthesis();
            } else if (reactionType === "NEUTRALIZATION") {
                targetLiquidColor = new THREE.Color(0x69F0AE); // Neutral green
                spawnBubbles(60, 0x00E5FF);
            } else if (reactionType === "ELEPHANT_TOOTHPASTE") {
                targetLiquidColor = new THREE.Color(0xFFD600); // Yellow foam
                spawnFoamEruption();
            } else if (reactionType === "PRECIPITATION") {
                targetLiquidColor = new THREE.Color(0x2979FF); // Royal blue Cu(OH)2
                spawnPrecipitateParticles();
            } else if (reactionType === "EFFERVESCENCE") {
                targetLiquidColor = new THREE.Color(0xE0F7FA);
                spawnBubbles(120, 0xFFFFFF);
            }
        };

        window.addChemical = function(name, symbol, colorHex) {
            if (colorHex) {
                targetLiquidColor = new THREE.Color(parseInt(colorHex.replace("#", "0x")));
            }
            // Animate liquid rising slightly
            liquidLevel = Math.min(1.2, liquidLevel + 0.15);
            spawnDropletRipple();
        };

        window.setBurnerState = function(enabled) {
            isBurnerOn = enabled;
            bunsenFlame.material.opacity = enabled ? 0.9 : 0.0;
            bunsenFlame.material.color = enabled ? new THREE.Color(0x00E5FF) : new THREE.Color(0x000000);
        };

        window.resetLab = function() {
            targetLiquidColor = new THREE.Color(0x1e3a5f);
            liquidLevel = 0.3;
            isBurnerOn = false;
            bunsenFlame.material.opacity = 0.0;
            // Clean particles
            particles.forEach(p => scene.remove(p));
            particles = [];
            smokeParticles.forEach(s => scene.remove(s));
            smokeParticles = [];
            bubbleParticles.forEach(b => scene.remove(b));
            bubbleParticles = [];
        };

        window.setTheme = function(isDark) {
            const bgHex = isDark ? 0x090D16 : 0xF1F5F9;
            if (scene) {
                scene.background = new THREE.Color(bgHex);
                if (scene.fog) scene.fog.color.setHex(bgHex);
            }
            if (renderer) {
                renderer.setClearColor(bgHex);
            }
            document.body.style.background = isDark ? "#090D16" : "#F1F5F9";
            const hud = document.getElementById('hud-overlay');
            if (hud) {
                hud.style.color = isDark ? "#00E5FF" : "#0284C7";
                hud.style.background = isDark ? "rgba(17, 24, 39, 0.7)" : "rgba(255, 255, 255, 0.85)";
                hud.style.borderColor = isDark ? "rgba(0, 229, 255, 0.2)" : "rgba(2, 132, 199, 0.3)";
                hud.style.textShadow = isDark ? "0 0 8px rgba(0,229,255,0.4)" : "none";
            }
            const status = document.getElementById('status-indicator');
            if (status) {
                status.style.color = isDark ? "#94A3B8" : "#475569";
                status.style.background = isDark ? "rgba(15, 23, 42, 0.6)" : "rgba(255, 255, 255, 0.8)";
            }
        };

        function spawnBubbles(count, color) {
            for (let i = 0; i < count; i++) {
                const geo = new THREE.SphereGeometry(0.015 + Math.random() * 0.02, 6, 6);
                const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.8 });
                const bubble = new THREE.Mesh(geo, mat);
                bubble.position.set(
                    (Math.random() - 0.5) * 0.6,
                    0.2 + Math.random() * 0.4,
                    (Math.random() - 0.5) * 0.6
                );
                bubble.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.01,
                    0.02 + Math.random() * 0.03,
                    (Math.random() - 0.5) * 0.01
                );
                bubble.life = 1.0;
                scene.add(bubble);
                bubbleParticles.push(bubble);
            }
        }

        function spawnFoamEruption() {
            for (let i = 0; i < 90; i++) {
                const geo = new THREE.SphereGeometry(0.04 + Math.random() * 0.05, 8, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xFFF9C4, roughness: 0.4 });
                const foam = new THREE.Mesh(geo, mat);
                foam.position.set(
                    (Math.random() - 0.5) * 0.5,
                    0.5 + Math.random() * 0.3,
                    (Math.random() - 0.5) * 0.5
                );
                foam.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.04,
                    0.05 + Math.random() * 0.07,
                    (Math.random() - 0.5) * 0.04
                );
                foam.life = 1.0;
                scene.add(foam);
                bubbleParticles.push(foam);
            }
        }

        function spawnPrecipitateParticles() {
            for (let i = 0; i < 80; i++) {
                const geo = new THREE.SphereGeometry(0.02, 6, 6);
                const mat = new THREE.MeshStandardMaterial({ color: 0x1E88E5 });
                const prec = new THREE.Mesh(geo, mat);
                prec.position.set(
                    (Math.random() - 0.5) * 0.6,
                    0.7 - Math.random() * 0.2,
                    (Math.random() - 0.5) * 0.6
                );
                prec.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.005,
                    -0.01 - Math.random() * 0.01, // Falling precipitate
                    (Math.random() - 0.5) * 0.005
                );
                prec.life = 1.2;
                scene.add(prec);
                bubbleParticles.push(prec);
            }
        }

        function spawnDropletRipple() {
            spawnBubbles(15, 0x00E5FF);
        }

        let shakeIntensity = 0;
        function cameraShake(intensity, durationMs) {
            shakeIntensity = intensity;
            const start = Date.now();
            const interval = setInterval(() => {
                const elapsed = Date.now() - start;
                if (elapsed >= durationMs) {
                    clearInterval(interval);
                    shakeIntensity = 0;
                } else {
                    shakeIntensity = intensity * (1 - elapsed / durationMs);
                }
            }, 16);
        }

        function setupEventListeners() {
            const canvas = document.getElementById('webgl-canvas');

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isOrbiting = true;
                    prevMouseX = e.touches[0].clientX;
                    prevMouseY = e.touches[0].clientY;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (isOrbiting && e.touches.length === 1) {
                    const dx = e.touches[0].clientX - prevMouseX;
                    const dy = e.touches[0].clientY - prevMouseY;
                    targetRotationY += dx * 0.008;
                    targetRotationX = Math.max(-0.4, Math.min(0.8, targetRotationX + dy * 0.008));
                    prevMouseX = e.touches[0].clientX;
                    prevMouseY = e.touches[0].clientY;
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => { isOrbiting = false; });
            canvas.addEventListener('mousedown', (e) => {
                isOrbiting = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (isOrbiting) {
                    const dx = e.clientX - prevMouseX;
                    const dy = e.clientY - prevMouseY;
                    targetRotationY += dx * 0.006;
                    targetRotationX = Math.max(-0.4, Math.min(0.8, targetRotationX + dy * 0.006));
                    prevMouseX = e.clientX;
                    prevMouseY = e.clientY;
                }
            });
            window.addEventListener('mouseup', () => { isOrbiting = false; });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth orbit damping
            currentRotationY += (targetRotationY - currentRotationY) * 0.08;
            currentRotationX += (targetRotationX - currentRotationX) * 0.08;
            beakerGroup.rotation.y = currentRotationY;
            beakerGroup.rotation.x = currentRotationX * 0.2;

            // Liquid color lerp
            currentLiquidColor.lerp(targetLiquidColor, 0.05);
            liquidMesh.material.color.copy(currentLiquidColor);

            // Liquid level lerp
            const curScaleY = liquidMesh.scale.y;
            liquidMesh.scale.y += (liquidLevel - curScaleY) * 0.08;
            liquidMesh.position.y = (liquidMesh.scale.y * 0.8) / 2;

            // Burner flame flicker
            if (isBurnerOn) {
                bunsenFlame.scale.set(
                    1 + (Math.random() - 0.5) * 0.2,
                    1 + (Math.random() - 0.5) * 0.3,
                    1 + (Math.random() - 0.5) * 0.2
                );
            }

            // Update explosion spark particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.velocity);
                p.velocity.y -= 0.003; // gravity
                p.life -= 0.02;
                p.material.opacity = p.life;
                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // Update smoke particles
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const s = smokeParticles[i];
                s.position.add(s.velocity);
                s.scale.multiplyScalar(1.02);
                s.life -= 0.015;
                s.material.opacity = s.life * 0.5;
                if (s.life <= 0) {
                    scene.remove(s);
                    smokeParticles.splice(i, 1);
                }
            }

            // Update bubble particles
            for (let i = bubbleParticles.length - 1; i >= 0; i--) {
                const b = bubbleParticles[i];
                b.position.add(b.velocity);
                b.life -= 0.018;
                b.material.opacity = b.life;
                if (b.life <= 0 || b.position.y > 1.8) {
                    scene.remove(b);
                    bubbleParticles.splice(i, 1);
                }
            }

            // Camera shake application
            if (shakeIntensity > 0) {
                camera.position.x = (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = 2.5 + (Math.random() - 0.5) * shakeIntensity;
            } else {
                camera.position.x = 0;
                camera.position.y = 2.5;
            }

            renderer.render(scene, camera);
        }

        // Initialize when ready
        window.onload = function() {
            initScene();
        };
    </script>
</body>
</html>
